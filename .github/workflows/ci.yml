# 智源 ANP · CI 门禁（对齐《开发标准与规范》§11 质量门禁）
# 每个 PR / push 到 main 必跑：lint + typecheck + test + 安全扫描。
# 全绿方可合入（分支保护规则后续在 GitHub 仓库设置里配置）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============ Go 后端 ============
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    # 测试硬依赖 PG（testutil.TestDB 连 anp_test + 跑迁移建全表）。
    # 本地默认连 .28 私网，GitHub-hosted runner 不可达 → 提供 service 容器 + 覆盖连接串。
    services:
      postgres:
        # pgvector 镜像：000001_init 迁移需 CREATE EXTENSION vector，标准 postgres:16 无此扩展。
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anp
          POSTGRES_PASSWORD: anp_dev_pwd
          POSTGRES_DB: anp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anp -d anp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ANP_TEST_DATABASE_URL: postgres://anp:anp_dev_pwd@localhost:5432/anp_test?sslmode=disable&connect_timeout=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./... --timeout 5m
      - name: go test
        # -p 1 串行执行包：测试共享同一 PG，并行包互相 TRUNCATE 同表会死锁/数据踩踏
        # （requirement/workspace 等间歇 FAIL）。串行避竞争，覆盖率仍正常采集。
        run: go test -p 1 ./... -coverprofile=coverage.out -covermode=atomic
      - name: 覆盖率门禁 (≥30%)
        run: |
          COV=$(go tool cover -func=coverage.out | awk '/^total/ {gsub("%",""); print $NF}')
          echo "Total coverage: ${COV}%"
          awk "BEGIN {exit !(${COV} >= 30)}" || { echo "::error::后端总覆盖率 ${COV}% 低于门禁 30%"; exit 1; }
      - name: 启动冒烟（捕获路由注册 panic/启动 fatal）
        # go test 装配的是各 handler 独立 router，捕获不到 gin 全路由注册冲突
        # （如 /users/:id 与 :uid 同段命名冲突只在完整 server boot 时 panic）。
        # 真启动二进制 + 探测 HTTP 监听：路由冲突/migration/seed/config 任何启动期
        # fatal 都让进程在 listen 前退出 → 探测拿不到 HTTP 响应（000）→ 失败。
        # 合 main 前拦住"CI 全绿但首次部署即崩"。判据=已监听（拿到任意 HTTP 状态码），
        # 不用登录（EnsurePassword 不建用户，go test 残留 user 表无 admin 会假挂）。
        run: |
          go build -o /tmp/anp-server ./cmd/server
          DATABASE_URL="$ANP_TEST_DATABASE_URL" \
          BACKEND_HTTP_ADDR=":8080" \
          BACKUP_INTERVAL_HOURS=0 DBSIZE_INTERVAL_HOURS=0 ACCESS_LOG_RETAIN_DAYS=0 \
            /tmp/anp-server > /tmp/anp-server.log 2>&1 &
          SRV_PID=$!
          up=0
          for i in $(seq 1 30); do
            if ! kill -0 "$SRV_PID" 2>/dev/null; then break; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ 2>/dev/null || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo "::error::backend 启动冒烟失败：30s 内未监听（路由注册 panic 或启动 fatal）"
            echo "----- server 日志 -----"; cat /tmp/anp-server.log
            exit 1
          fi
          echo "✓ backend 启动冒烟通过（HTTP 已监听，路由装配无冲突）"
          kill "$SRV_PID" 2>/dev/null || true
          wait "$SRV_PID" 2>/dev/null || true
      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: platform/backend/coverage.out

  # ============ 前端 ============
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm --filter frontend lint
      - name: prettier check
        run: pnpm --filter frontend exec prettier --check .
      - name: tsc typecheck
        run: pnpm --filter frontend exec tsc --noEmit
      - name: vitest
        run: pnpm --filter frontend test
      - name: build
        run: pnpm --filter frontend build

  # ============ Python AI 运行时 ============
  python:
    name: Agent Runtime (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - name: ruff lint
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  # ============ OpenAPI 契约（生成 + 一致性检查）============
  openapi:
    name: OpenAPI (swag + gen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: install swag
        working-directory: platform/backend
        run: go install github.com/swaggo/swag/cmd/swag@latest
      - name: swag init
        working-directory: platform/backend
        run: swag init -g cmd/server/main.go -o docs --parseDependency --parseInternal
      - run: pnpm install --frozen-lockfile
      - name: swagger2openapi + openapi-typescript
        run: |
          cd platform/frontend
          pnpm exec swagger2openapi ../backend/docs/swagger.json -o ../backend/docs/openapi.json --patch
          pnpm exec openapi-typescript ../backend/docs/openapi.json -o lib/api-types.ts
      - name: 契约一致性（生成的须与提交一致，否则说明改了 handler 没 regen）
        run: git diff --exit-code -- platform/backend/docs platform/frontend/lib/api-types.ts

  # ============ 安全扫描（密钥泄漏）============
  security:
    name: Security (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
